---
name: hk

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hk:
    uses: hugoh/gh-workflows/.github/workflows/hk.yml@5e3ffc337ef532df4ff618c5d2844a09b254eaee # v1.40.10
    permissions:
      contents: read
      packages: read
      statuses: write
