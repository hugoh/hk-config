---
name: release

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    uses: hugoh/gh-workflows/.github/workflows/release.yml@7411f5764f11602df3a0e261d428d3e7a69e59a7 # v1.38.2
    permissions:
      contents: write
    with:
      package-command: pkl project package --output-path dist
      package-artifacts: dist/*
