---
name: release

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    uses: hugoh/gh-workflows/.github/workflows/release.yml@98894bfdb331f6bfc3e1b7a1d1ddbe637080a031 # v1.40.4
    permissions:
      contents: write
    with:
      package-command: pkl project package --output-path dist
      package-artifacts: dist/*
